name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      # `lake build` builds only the modules of the required libraries that this repository imports;
      # the audit reads all of them.
      - name: Build the libraries that the audit reads
        run: lake build Phylogenetics PhyloNetwork
      # The audit sees a module's proofs only through its own `import all` line.
      - name: Check that the audit imports every module of the libraries
        run: python3 scripts/gen_audit.py --check
      # It imports the deprecated modules too, whose import warns.
      - name: Audit the axioms
        run: lake env lean -Dlinter.deprecated.module=false scripts/Audit.lean
      - name: Check the Markdown tables
        run: python3 scripts/check_md_tables.py README.md TreeOfBlobs/README.md docs/OVERVIEW.md
      # The README's tables are generated from catalog/papers.toml by the root's tools.
      - name: Check that the README is current
        run: |
          git clone --depth 1 https://github.com/vltanh/lean4-phylogenetics ../lean4-phylogenetics
          python3 ../lean4-phylogenetics/scripts/status.py readme --check --repo lean4-phylo-tree-of-blobs --fetch-hubs
