name = "TreeOfBlobs"
version = "0.3.0"
keywords = ["math", "phylogenetics"]
description = "What only the formalizations of the tree-of-blobs papers share: their algorithms and standing assumptions, networks given by tables, lowest common ancestors, and the analysis only they use"
defaultTargets = ["TreeOfBlobs"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "3fcabfd7d191990dda268b0b3968d945b65eb59a"

# The hub above this one: what the papers on network estimation share, those on the tree of blobs
# included.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/vltanh/lean4-phylo-network"
rev = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of this repository is under TreeOfBlobs/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "TreeOfBlobs"
globs = ["TreeOfBlobs.+"]
