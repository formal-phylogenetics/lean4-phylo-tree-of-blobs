name = "TreeOfBlobs"
version = "0.2.0"
keywords = ["math", "phylogenetics"]
description = "What the formalizations of the tree-of-blobs papers share: hypothesis tests on quartet concordance factors, blobs of level-1 networks, and the sources the papers cite"
defaultTargets = ["TreeOfBlobs"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "b56ce531644230622f069aaa8aa51a5143c1411e"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of this repository is under TreeOfBlobs/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "TreeOfBlobs"
globs = ["TreeOfBlobs.+"]
